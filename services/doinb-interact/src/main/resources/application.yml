server:
  port: 8085

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:doinb_interact}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:test}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

doinb:
  role: service
  service-name: doinb-interact
  internal-token: ${DOINB_INTERNAL_TOKEN:doinb-internal-dev-token}
  services:
    user: ${DOINB_USER_URL:http://127.0.0.1:8082}
    video: ${DOINB_VIDEO_URL:http://127.0.0.1:8083}
    live: ${DOINB_LIVE_URL:http://127.0.0.1:8084}
    message: ${DOINB_MESSAGE_URL:http://127.0.0.1:8086}
  public-path-prefixes:
    - /health
    - /comment/list
    - /video/reaction/summary

jwt:
  secret: ${JWT_SECRET:change-me-in-local-config-at-least-32-chars!!}
  expire: 86400000
