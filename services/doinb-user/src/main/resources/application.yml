server:
  port: 8082

doinb:
  role: service
  service-name: doinb-user
  internal-token: ${DOINB_INTERNAL_TOKEN:doinb-internal-dev-token}
  public-path-prefixes:
    - /health
    - /user/account/register
    - /user/account/login
    - /admin/account/login
    - /user/info/get-one
    - /user/profile/showcase
    - /uploads/avatars

jwt:
  secret: ${JWT_SECRET:change-me-in-local-config-at-least-32-chars!!}
  expire: 86400000
