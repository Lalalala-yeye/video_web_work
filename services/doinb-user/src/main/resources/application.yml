server:
  port: 8082

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:doinb}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:test}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

upload:
  path: ${UPLOAD_PATH:uploads}

doinb:
  role: service
  service-name: doinb-user
  internal-token: ${DOINB_INTERNAL_TOKEN:doinb-internal-dev-token}
  public-path-prefixes:
    - /health
    - /user/account/register
    - /user/account/login
    - /admin/account/login
    - /user/info/get-one
    - /user/profile/showcase
    - /uploads/avatars

jwt:
  secret: ${JWT_SECRET:change-me-in-local-config-at-least-32-chars!!}
  expire: 86400000
