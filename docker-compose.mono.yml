# 课设第 4 项「改造前」：旧单体 backend + MySQL。
# 和现在的 docker-compose.yml 抢 8081 / 3307，同一时刻只能起一套。
#
#   docker compose -f docker-compose.mono.yml up --build -d
#   curl http://127.0.0.1:8081/health    # 应看到 doinb-backend ok
#   docker compose -f docker-compose.mono.yml down

name: doinb-mono

services:
  mysql:
    image: mysql:8.0
    container_name: doinb-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-test}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-doinb}
    ports:
      - "3307:3306"
    volumes:
      - doinb-mysql-data:/var/lib/mysql
      - ./database/database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_PASSWORD:-test}", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: doinb-backend:local
    container_name: doinb-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ci
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-doinb}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-test}
      JWT_SECRET: ${JWT_SECRET:-compose-demo-secret-at-least-32-chars!!}
      UPLOAD_PATH: /app/uploads
      APP_VERSION: ${APP_VERSION:-mono}
    ports:
      - "8081:8081"
    volumes:
      - doinb-mono-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

volumes:
  doinb-mysql-data:
  doinb-mono-uploads:
