# 测试门禁：先跑无库单测+MockMvc，通过后再起 MySQL 跑 Postman/Newman。
# 任一失败则整条流水线停止，不打镜像。
name: Test gate

on:
  push:
  pull_request:

jobs:
  backend-test:
    name: Backend unit + API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run tests (no MySQL)
        run: |
          chmod +x mvnw
          ./mvnw -B test

  postman:
    name: Postman Newman (MySQL)
    needs: backend-test
    runs-on: ubuntu-latest
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: doinb
      MYSQL_USER: root
      MYSQL_PASSWORD: test
      JWT_SECRET: ci-test-secret-at-least-32-characters!!
      SPRING_PROFILES_ACTIVE: ci
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: doinb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Init schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" < database/database.sql
      - name: Package backend
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B package -DskipTests
      - name: Start backend
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: ci
        run: |
          mkdir -p /tmp/doinb-uploads
          nohup java -jar target/backend-0.0.1-SNAPSHOT.jar --spring.profiles.active=ci > /tmp/doinb-backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8081/health >/dev/null; then
              echo "backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "backend failed to start"
          cat /tmp/doinb-backend.log
          exit 1
      - name: Newman
        run: |
          npx --yes newman@6 run postman/doinb.postman_collection.json \
            -e postman/doinb.ci.postman_environment.json \
            --bail \
            --color off
