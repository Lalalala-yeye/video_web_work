# 测试门禁：单测+MockMvc → Postman/Newman 失败则整条流水线失败（后面不打镜像、不部署）。
# Newman 通过后打带 git 短 SHA 的镜像推到 GHCR（禁止 latest），再在 kind 上部署并探活。
# Selenium E2E 仍会跑，但 continue-on-error：失败不挡住打镜像和 K8s 部署。
name: Test gate

on:
  push:

jobs:
  backend-test:
    name: Backend unit + API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run tests (no MySQL)
        run: |
          chmod +x mvnw
          ./mvnw -B test

  postman:
    name: Postman Newman (MySQL)
    needs: backend-test
    runs-on: ubuntu-latest
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: doinb
      MYSQL_USER: root
      MYSQL_PASSWORD: test
      JWT_SECRET: ci-test-secret-at-least-32-characters!!
      SPRING_PROFILES_ACTIVE: ci
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: doinb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Init schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" < database/database.sql
      - name: Package backend
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B package -DskipTests
      - name: Start backend
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: ci
        run: |
          mkdir -p /tmp/doinb-uploads
          nohup java -jar target/backend-0.0.1-SNAPSHOT.jar --spring.profiles.active=ci > /tmp/doinb-backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8081/health >/dev/null; then
              echo "backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "backend failed to start"
          cat /tmp/doinb-backend.log
          exit 1
      - name: Newman
        run: |
          npx --yes newman@6 run postman/doinb.postman_collection.json \
            -e postman/doinb.ci.postman_environment.json \
            --bail \
            --color off

  e2e:
    name: Selenium E2E (Chrome)
    needs: postman
    # 课设门禁以单测+集成为准；E2E 保留可见结果，失败不让 workflow 变红。后续打镜像请 needs: postman，不要 needs: e2e。
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: doinb
      MYSQL_USER: root
      MYSQL_PASSWORD: test
      JWT_SECRET: ci-test-secret-at-least-32-characters!!
      SPRING_PROFILES_ACTIVE: ci
      E2E_HEADLESS: "1"
      E2E_BASE_URL: http://127.0.0.1:8787
      E2E_API: http://127.0.0.1:8081
      E2E_ADMIN_USER: demo_admin
      E2E_ADMIN_PASSWORD: "123456"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: doinb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable
      - name: Init schema + seed
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" < database/database.sql
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" < database/seed.sql
      - name: Package backend
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B package -DskipTests
      - name: Start backend
        working-directory: backend
        run: |
          mkdir -p /tmp/doinb-uploads
          nohup java -jar target/backend-0.0.1-SNAPSHOT.jar --spring.profiles.active=ci > /tmp/doinb-backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8081/health >/dev/null; then
              echo "backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "backend failed to start"
          cat /tmp/doinb-backend.log
          exit 1
      - name: Install frontend deps
        working-directory: web
        run: npm ci
      - name: Start frontend
        working-directory: web
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 8787 --strictPort --open false > /tmp/doinb-web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8787 >/dev/null; then
              echo "frontend is up"
              exit 0
            fi
            sleep 2
          done
          echo "frontend failed to start"
          cat /tmp/doinb-web.log
          exit 1
      - name: Run Selenium E2E
        working-directory: web
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        # 01 账号 → 02 浏览搜索 → 03 互动 → 04 创作中心/直播 → 05 通知私信后台
        run: npm run e2e:ci
      - name: Upload E2E screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: web/e2e/artifacts/
          if-no-files-found: ignore
      - name: Dump backend log
        if: failure()
        run: cat /tmp/doinb-backend.log || true

  build-images:
    name: Build versioned images (GHCR)
    needs: postman
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      backend: ${{ steps.meta.outputs.backend }}
      web: ${{ steps.meta.outputs.web }}
      sha: ${{ steps.meta.outputs.sha }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Image tags (git short SHA, never latest)
        id: meta
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SHA="${GITHUB_SHA::7}"
          echo "backend=ghcr.io/${OWNER}/doinb-backend:${SHA}" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${OWNER}/doinb-web:${SHA}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.backend }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=doinb-backend
          cache-to: type=gha,mode=max,scope=doinb-backend
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ${{ steps.meta.outputs.web }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=doinb-web
          cache-to: type=gha,mode=max,scope=doinb-web
      - name: Write image names to summary
        run: |
          {
            echo "### 已推送镜像"
            echo ""
            echo "- \`${{ steps.meta.outputs.backend }}\`"
            echo "- \`${{ steps.meta.outputs.web }}\`"
            echo ""
            echo "tag =  \`${{ steps.meta.outputs.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-k8s:
    name: Deploy kind + health (CD-02)
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    env:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_PASSWORD: test
      JWT_SECRET: ci-test-secret-at-least-32-characters!!
      BACKEND_IMAGE: ${{ needs.build-images.outputs.backend }}
      WEB_IMAGE: ${{ needs.build-images.outputs.web }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull this SHA's images
        run: |
          docker pull "$BACKEND_IMAGE"
          docker pull "$WEB_IMAGE"
          docker pull mysql:8.0
          docker pull busybox:1.36.1
          docker pull curlimages/curl:8.12.1
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: doinb-ci
          wait: 120s
      - name: Load images into kind
        run: |
          for img in "$BACKEND_IMAGE" "$WEB_IMAGE" mysql:8.0 busybox:1.36.1 curlimages/curl:8.12.1; do
            kind load docker-image "$img" --name doinb-ci
          done
      - name: Apply manifests (this SHA, 1 replica)
        run: |
          sed -i "s|image: ghcr.io/.*/doinb-backend:.*|image: ${BACKEND_IMAGE}|" deploy/k8s/backend.yaml
          sed -i "s|image: ghcr.io/.*/doinb-web:.*|image: ${WEB_IMAGE}|" deploy/k8s/web.yaml
          sed -i '0,/replicas: 2/s//replicas: 1/' deploy/k8s/backend.yaml
          sed -i '0,/replicas: 2/s//replicas: 1/' deploy/k8s/web.yaml
          kubectl apply -f deploy/k8s/namespace.yaml
          kubectl create secret generic doinb-secrets -n doinb \
            --from-literal=MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
            --from-literal=MYSQL_PASSWORD="$MYSQL_PASSWORD" \
            --from-literal=JWT_SECRET="$JWT_SECRET"
          kubectl create configmap doinb-db-init -n doinb \
            --from-file=database.sql=database/database.sql
          kubectl apply -k deploy/k8s
      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/mysql -n doinb --timeout=180s
          kubectl rollout status deployment/backend -n doinb --timeout=300s
          kubectl rollout status deployment/web -n doinb --timeout=180s
          kubectl get pods,services,deployments -n doinb -o wide
      - name: Health checks from inside the cluster
        run: |
          kubectl run doinb-healthcheck -n doinb --restart=Never \
            --image=curlimages/curl:8.12.1 \
            --command -- sh -c \
            'curl -fsS http://backend:8081/health && echo && curl -fsS http://web/ >/dev/null && curl -fsS http://web/api/health && echo'
          for i in $(seq 1 36); do
            phase=$(kubectl get pod doinb-healthcheck -n doinb -o jsonpath='{.status.phase}')
            echo "healthcheck phase=${phase}"
            if [ "$phase" = "Succeeded" ]; then
              kubectl logs doinb-healthcheck -n doinb
              exit 0
            fi
            if [ "$phase" = "Failed" ]; then
              kubectl logs doinb-healthcheck -n doinb || true
              kubectl describe pod doinb-healthcheck -n doinb
              exit 1
            fi
            sleep 5
          done
          echo "healthcheck timed out"
          kubectl describe pod doinb-healthcheck -n doinb || true
          exit 1
      - name: Dump cluster on failure
        if: failure()
        run: |
          kubectl get pods,svc,deploy -n doinb -o wide || true
          kubectl describe pods -n doinb || true
          kubectl logs -n doinb -l app=backend --tail=120 || true
          kubectl logs -n doinb -l app=web --tail=80 || true
          kubectl logs -n doinb -l app=mysql --tail=80 || true
      - name: Write deploy result to summary
        if: always()
        run: |
          {
            echo "### CD-02 kind 部署"
            echo ""
            echo "- backend: \`$BACKEND_IMAGE\`"
            echo "- web: \`$WEB_IMAGE\`"
            echo "- 探活: \`/health\`、web \`/\`、web \`/api/health\`"
          } >> "$GITHUB_STEP_SUMMARY"
