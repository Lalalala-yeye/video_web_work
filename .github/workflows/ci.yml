# 测试门禁：微服务单测 → 网关 Newman → 打各服务镜像 → kind 部署并探活。
# Selenium E2E continue-on-error：失败不挡住打镜像和 K8s 部署。
name: Test gate

on:
  push:

jobs:
  services-test:
    name: Microservices unit + API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: services/pom.xml
      - name: Run tests (no MySQL)
        run: |
          chmod +x mvnw
          set -o pipefail
          ./mvnw -B test 2>&1 | tee /tmp/services-test.log
      - name: Write test result to summary
        if: always()
        run: |
          {
            echo "### Microservices unit + API tests"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "- 结果: 通过"
            else
              echo "- 结果: 失败"
              echo ""
              echo "#### 出错原因"
              echo ""
              echo '```'
              find . -path '*/surefire-reports/*.txt' -print0 2>/dev/null | xargs -0 grep -h -E 'Tests run:|FAILURE|ERROR|<<< FAILURE|<<< ERROR' | head -80 || true
              if [ -f /tmp/services-test.log ]; then
                echo "----- Maven 错误 -----"
                grep -E '\[ERROR\]' /tmp/services-test.log | tail -40 || true
                echo "----- 日志末尾 -----"
                tail -25 /tmp/services-test.log
              fi
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  postman:
    name: Postman Newman (gateway + MySQL)
    needs: services-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: doinb
      MYSQL_USER: root
      MYSQL_PASSWORD: test
      JWT_SECRET: ci-test-secret-at-least-32-characters!!
      SPRING_PROFILES_ACTIVE: ci
      APP_VERSION: ci
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: doinb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: services/pom.xml
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Init schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" < database/database.sql
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" < database/seed.sql
      - name: Package microservices
        working-directory: services
        run: |
          chmod +x mvnw ci-start.sh
          ./mvnw -B package -DskipTests
      - name: Start gateway + five services
        working-directory: services
        run: |
          mkdir -p /tmp/doinb-uploads
          bash ./ci-start.sh
          touch /tmp/services-up
      - name: Newman (all public APIs)
        run: |
          set -o pipefail
          npx --yes newman@6 run postman/doinb.full.postman_collection.json \
            -e postman/doinb.ci.postman_environment.json \
            --working-dir . \
            --timeout-request 120000 \
            --bail \
            --color off \
            2>&1 | tee /tmp/newman.log
      - name: Probe health / ready / version + service logs
        if: always()
        run: |
          {
            echo "### 网关探活（健康 / 就绪 / 版本）"
            echo ""
            echo '```'
            echo "GET /health"
            curl -sS http://127.0.0.1:8081/health || true
            echo
            echo "GET /ready"
            curl -sS http://127.0.0.1:8081/ready || true
            echo
            echo "GET /version"
            curl -sS http://127.0.0.1:8081/version || true
            echo
            echo "----- 各业务服务 /health /ready /version -----"
            for spec in user:8082 video:8083 live:8084 interact:8085 message:8086; do
              name="${spec%%:*}"
              port="${spec##*:}"
              echo "==== doinb-${name} :${port} ===="
              curl -sS "http://127.0.0.1:${port}/health" || true
              echo
              curl -sS "http://127.0.0.1:${port}/ready" || true
              echo
              curl -sS "http://127.0.0.1:${port}/version" || true
              echo
            done
            echo "----- 各服务日志末尾 -----"
            for n in doinb-gateway doinb-user doinb-video doinb-live doinb-interact doinb-message; do
              echo "==== $n ===="
              tail -30 "/tmp/${n}.log" 2>/dev/null || true
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Write Newman result to summary
        if: always()
        run: |
          {
            echo "### Postman Newman（全量公开接口，打网关 8081）"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "- 结果: 通过"
            else
              echo "- 结果: 失败"
              echo ""
              echo "#### 出错原因"
              echo ""
              echo '```'
              if [ ! -f /tmp/services-up ]; then
                echo "微服务未能启动，Newman 未执行。"
              else
                if [ -f /tmp/newman.log ]; then
                  grep -E 'failed|AssertionError|Error|FAIL' /tmp/newman.log | tail -40 || true
                  echo "----- Newman 日志末尾 -----"
                  tail -40 /tmp/newman.log
                fi
              fi
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Selenium E2E (Chrome)
    needs: postman
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: doinb
      MYSQL_USER: root
      MYSQL_PASSWORD: test
      JWT_SECRET: ci-test-secret-at-least-32-characters!!
      SPRING_PROFILES_ACTIVE: ci
      E2E_HEADLESS: "1"
      E2E_BASE_URL: http://127.0.0.1:8787
      E2E_API: http://127.0.0.1:8081
      E2E_ADMIN_USER: demo_admin
      E2E_ADMIN_PASSWORD: "123456"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: doinb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: services/pom.xml
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable
      - name: Init schema + seed
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" < database/database.sql
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" < database/seed.sql
      - name: Package and start microservices
        working-directory: services
        run: |
          chmod +x mvnw ci-start.sh
          ./mvnw -B package -DskipTests
          mkdir -p /tmp/doinb-uploads
          bash ./ci-start.sh
          touch /tmp/e2e-backend-up
      - name: Install frontend deps
        working-directory: web
        run: npm ci
      - name: Start frontend
        working-directory: web
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 8787 --strictPort --open false > /tmp/doinb-web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8787 >/dev/null; then
              echo "frontend is up"
              touch /tmp/e2e-web-up
              exit 0
            fi
            sleep 2
          done
          echo "frontend failed to start"
          cat /tmp/doinb-web.log
          exit 1
      - name: Run Selenium E2E
        id: e2e
        working-directory: web
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          set -o pipefail
          npm run e2e:ci 2>&1 | tee /tmp/e2e.log
      - name: Upload E2E screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: web/e2e/artifacts/
          if-no-files-found: ignore
      - name: Dump service logs
        if: failure()
        run: |
          for n in doinb-gateway doinb-user doinb-video doinb-live doinb-interact doinb-message; do
            echo "==== $n ===="
            tail -80 "/tmp/${n}.log" || true
          done
      - name: Write E2E result to summary
        if: always()
        run: |
          {
            echo "### Selenium E2E"
            echo ""
            if [ "${{ steps.e2e.outcome }}" = "success" ]; then
              echo "- 结果: 通过"
            else
              echo "- 结果: 失败（本 job continue-on-error，不挡住打镜像）"
              echo ""
              echo "#### 出错原因"
              echo ""
              echo '```'
              if [ ! -f /tmp/e2e-backend-up ]; then
                echo "网关/业务服务未能启动，E2E 未执行。"
              elif [ ! -f /tmp/e2e-web-up ]; then
                echo "前端未能在 8787 启动，E2E 未执行。"
                tail -80 /tmp/doinb-web.log || true
              else
                if [ -f /tmp/e2e.log ]; then
                  grep -E '失败|Error|TimeoutError|AssertionError|FAIL' /tmp/e2e.log | tail -40 || true
                  echo "----- E2E 日志末尾 -----"
                  tail -40 /tmp/e2e.log
                fi
              fi
              echo '```'
              echo ""
              echo "失败截图见 artifact \`e2e-screenshots\`。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-images:
    name: Build versioned images (GHCR)
    needs: postman
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      owner: ${{ steps.meta.outputs.owner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Image tags (git short SHA, never latest)
        id: meta
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SHA="${GITHUB_SHA::7}"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: ./services
          file: ./services/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/doinb-gateway:${{ steps.meta.outputs.sha }}
          build-args: |
            MODULE=doinb-gateway
            PORT=8081
            APP_VERSION=${{ steps.meta.outputs.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=doinb-gateway
          cache-to: type=gha,mode=max,scope=doinb-gateway
      - name: Build and push user
        uses: docker/build-push-action@v6
        with:
          context: ./services
          file: ./services/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/doinb-user:${{ steps.meta.outputs.sha }}
          build-args: |
            MODULE=doinb-user
            PORT=8082
            APP_VERSION=${{ steps.meta.outputs.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=doinb-user
          cache-to: type=gha,mode=max,scope=doinb-user
      - name: Build and push video
        uses: docker/build-push-action@v6
        with:
          context: ./services
          file: ./services/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/doinb-video:${{ steps.meta.outputs.sha }}
          build-args: |
            MODULE=doinb-video
            PORT=8083
            APP_VERSION=${{ steps.meta.outputs.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=doinb-video
          cache-to: type=gha,mode=max,scope=doinb-video
      - name: Build and push live
        uses: docker/build-push-action@v6
        with:
          context: ./services
          file: ./services/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/doinb-live:${{ steps.meta.outputs.sha }}
          build-args: |
            MODULE=doinb-live
            PORT=8084
            APP_VERSION=${{ steps.meta.outputs.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=doinb-live
          cache-to: type=gha,mode=max,scope=doinb-live
      - name: Build and push interact
        uses: docker/build-push-action@v6
        with:
          context: ./services
          file: ./services/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/doinb-interact:${{ steps.meta.outputs.sha }}
          build-args: |
            MODULE=doinb-interact
            PORT=8085
            APP_VERSION=${{ steps.meta.outputs.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=doinb-interact
          cache-to: type=gha,mode=max,scope=doinb-interact
      - name: Build and push message
        uses: docker/build-push-action@v6
        with:
          context: ./services
          file: ./services/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/doinb-message:${{ steps.meta.outputs.sha }}
          build-args: |
            MODULE=doinb-message
            PORT=8086
            APP_VERSION=${{ steps.meta.outputs.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=doinb-message
          cache-to: type=gha,mode=max,scope=doinb-message
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/doinb-web:${{ steps.meta.outputs.sha }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=doinb-web
          cache-to: type=gha,mode=max,scope=doinb-web
      - name: Write image names to summary
        if: always()
        run: |
          {
            echo "### CD-01 构建镜像"
            echo ""
            OWNER="${{ steps.meta.outputs.owner }}"
            SHA="${{ steps.meta.outputs.sha }}"
            if [ "${{ job.status }}" = "success" ]; then
              echo "- 结果: 已推送"
              for m in doinb-gateway doinb-user doinb-video doinb-live doinb-interact doinb-message doinb-web; do
                echo "- \`ghcr.io/${OWNER}/${m}:${SHA}\`"
              done
              echo "- tag = \`${SHA}\`"
            else
              echo "- 结果: 失败"
              echo "- 请查看 Java services / web 构建步骤日志。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-k8s:
    name: Deploy kind + health (CD-02)
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
    env:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_PASSWORD: test
      JWT_SECRET: ci-test-secret-at-least-32-characters!!
      DOINB_INTERNAL_TOKEN: doinb-internal-dev-token
      OWNER: ${{ needs.build-images.outputs.owner }}
      SHA: ${{ needs.build-images.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull this SHA's images
        run: |
          for m in doinb-gateway doinb-user doinb-video doinb-live doinb-interact doinb-message doinb-web; do
            docker pull "ghcr.io/${OWNER}/${m}:${SHA}"
          done
          docker pull mysql:8.0
          docker pull busybox:1.36.1
          docker pull curlimages/curl:8.12.1
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: doinb-ci
          wait: 120s
      - name: Load images into kind
        run: |
          for m in doinb-gateway doinb-user doinb-video doinb-live doinb-interact doinb-message doinb-web; do
            kind load docker-image "ghcr.io/${OWNER}/${m}:${SHA}" --name doinb-ci
          done
          kind load docker-image mysql:8.0 --name doinb-ci
          kind load docker-image busybox:1.36.1 --name doinb-ci
          kind load docker-image curlimages/curl:8.12.1 --name doinb-ci
      - name: Apply manifests (this SHA, 1 replica)
        run: |
          for m in gateway user video live interact message; do
            sed -i "s|image: ghcr.io/.*/doinb-${m}:.*|image: ghcr.io/${OWNER}/doinb-${m}:${SHA}|" deploy/k8s/java-services.yaml
          done
          sed -i "s|image: ghcr.io/.*/doinb-web:.*|image: ghcr.io/${OWNER}/doinb-web:${SHA}|" deploy/k8s/web.yaml
          sed -i "s/APP_VERSION: \"cde7310\"/APP_VERSION: \"${SHA}\"/" deploy/k8s/java-services.yaml
          sed -i 's/replicas: 2/replicas: 1/g' deploy/k8s/java-services.yaml deploy/k8s/web.yaml
          kubectl apply -f deploy/k8s/namespace.yaml
          kubectl create secret generic doinb-secrets -n doinb \
            --from-literal=MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
            --from-literal=MYSQL_PASSWORD="$MYSQL_PASSWORD" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=DOINB_INTERNAL_TOKEN="$DOINB_INTERNAL_TOKEN"
          kubectl create configmap doinb-db-init -n doinb \
            --from-file=database.sql=database/database.sql
          kubectl apply -k deploy/k8s
      - name: Wait for rollouts
        run: |
          for d in mysql user video live interact message gateway web; do
            kubectl rollout status "deployment/${d}" -n doinb --timeout=300s
          done
          kubectl get pods,services,deployments -n doinb -o wide
      - name: Health / ready / version from inside the cluster
        run: |
          kubectl run doinb-healthcheck -n doinb --restart=Never \
            --image=curlimages/curl:8.12.1 \
            --command -- sh -c \
            'curl -fsS http://gateway:8081/health && echo && curl -fsS http://gateway:8081/ready && echo && curl -fsS http://gateway:8081/version && echo && curl -fsS http://user:8082/health && echo && curl -fsS http://video:8083/ready && echo && curl -fsS http://web/ >/dev/null && curl -fsS http://web/api/health && echo'
          for i in $(seq 1 48); do
            phase=$(kubectl get pod doinb-healthcheck -n doinb -o jsonpath='{.status.phase}')
            echo "healthcheck phase=${phase}"
            if [ "$phase" = "Succeeded" ]; then
              kubectl logs doinb-healthcheck -n doinb
              exit 0
            fi
            if [ "$phase" = "Failed" ]; then
              kubectl logs doinb-healthcheck -n doinb || true
              kubectl describe pod doinb-healthcheck -n doinb
              exit 1
            fi
            sleep 5
          done
          echo "healthcheck timed out"
          kubectl describe pod doinb-healthcheck -n doinb || true
          exit 1
      - name: Dump cluster on failure
        if: failure()
        run: |
          kubectl get pods,svc,deploy -n doinb -o wide || true
          kubectl describe pods -n doinb || true
          for app in gateway user video live interact message web mysql; do
            echo "==== logs $app ===="
            kubectl logs -n doinb -l "app=${app}" --tail=80 || true
          done
      - name: Write deploy result to summary
        if: always()
        run: |
          {
            echo "### CD-02 kind 部署"
            echo ""
            echo "- tag: \`$SHA\`"
            if [ "${{ job.status }}" = "success" ]; then
              echo "- 部署成功。集群内已探活: gateway \`/health\` \`/ready\` \`/version\`、user \`/health\`、video \`/ready\`、web \`/\` 与 \`/api/health\`"
            else
              echo "- 部署或健康检查未通过（状态: ${{ job.status }}）"
              echo ""
              echo "#### 出错原因"
              echo ""
              echo '```'
              kubectl get pods,svc,deploy -n doinb -o wide 2>/dev/null || echo "集群信息不可用"
              echo "----- 最近事件 -----"
              kubectl get events -n doinb --sort-by='.lastTimestamp' 2>/dev/null | tail -25 || true
              echo '```'
              echo ""
              echo "更完整日志见步骤 Dump cluster on failure。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
