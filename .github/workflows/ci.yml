# 测试门禁：单测+MockMvc → Postman/Newman 失败则整条流水线失败（后面不打镜像）。
# Newman 通过后打带 git 短 SHA 的镜像推到 GHCR（禁止 latest）。
# Selenium E2E 仍会跑，但 continue-on-error：失败不挡住打镜像。
name: Test gate

on:
  push:

jobs:
  backend-test:
    name: Backend unit + API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run tests (no MySQL)
        run: |
          chmod +x mvnw
          ./mvnw -B test

  postman:
    name: Postman Newman (MySQL)
    needs: backend-test
    runs-on: ubuntu-latest
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: doinb
      MYSQL_USER: root
      MYSQL_PASSWORD: test
      JWT_SECRET: ci-test-secret-at-least-32-characters!!
      SPRING_PROFILES_ACTIVE: ci
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: doinb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Init schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" < database/database.sql
      - name: Package backend
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B package -DskipTests
      - name: Start backend
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: ci
        run: |
          mkdir -p /tmp/doinb-uploads
          nohup java -jar target/backend-0.0.1-SNAPSHOT.jar --spring.profiles.active=ci > /tmp/doinb-backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8081/health >/dev/null; then
              echo "backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "backend failed to start"
          cat /tmp/doinb-backend.log
          exit 1
      - name: Newman
        run: |
          npx --yes newman@6 run postman/doinb.postman_collection.json \
            -e postman/doinb.ci.postman_environment.json \
            --bail \
            --color off

  e2e:
    name: Selenium E2E (Chrome)
    needs: postman
    # 课设门禁以单测+集成为准；E2E 保留可见结果，失败不让 workflow 变红。后续打镜像请 needs: postman，不要 needs: e2e。
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: doinb
      MYSQL_USER: root
      MYSQL_PASSWORD: test
      JWT_SECRET: ci-test-secret-at-least-32-characters!!
      SPRING_PROFILES_ACTIVE: ci
      E2E_HEADLESS: "1"
      E2E_BASE_URL: http://127.0.0.1:8787
      E2E_API: http://127.0.0.1:8081
      E2E_ADMIN_USER: demo_admin
      E2E_ADMIN_PASSWORD: "123456"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: doinb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable
      - name: Init schema + seed
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" < database/database.sql
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" < database/seed.sql
      - name: Package backend
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B package -DskipTests
      - name: Start backend
        working-directory: backend
        run: |
          mkdir -p /tmp/doinb-uploads
          nohup java -jar target/backend-0.0.1-SNAPSHOT.jar --spring.profiles.active=ci > /tmp/doinb-backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8081/health >/dev/null; then
              echo "backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "backend failed to start"
          cat /tmp/doinb-backend.log
          exit 1
      - name: Install frontend deps
        working-directory: web
        run: npm ci
      - name: Start frontend
        working-directory: web
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 8787 --strictPort --open false > /tmp/doinb-web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8787 >/dev/null; then
              echo "frontend is up"
              exit 0
            fi
            sleep 2
          done
          echo "frontend failed to start"
          cat /tmp/doinb-web.log
          exit 1
      - name: Run Selenium E2E
        working-directory: web
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        # 01 账号 → 02 浏览搜索 → 03 互动 → 04 创作中心/直播 → 05 通知私信后台
        run: npm run e2e:ci
      - name: Upload E2E screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: web/e2e/artifacts/
          if-no-files-found: ignore
      - name: Dump backend log
        if: failure()
        run: cat /tmp/doinb-backend.log || true

  build-images:
    name: Build versioned images (GHCR)
    needs: postman
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Image tags (git short SHA, never latest)
        id: meta
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SHA="${GITHUB_SHA::7}"
          echo "backend=ghcr.io/${OWNER}/doinb-backend:${SHA}" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${OWNER}/doinb-web:${SHA}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.backend }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=doinb-backend
          cache-to: type=gha,mode=max,scope=doinb-backend
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ${{ steps.meta.outputs.web }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=doinb-web
          cache-to: type=gha,mode=max,scope=doinb-web
      - name: Write image names to summary
        run: |
          {
            echo "### 已推送镜像（无 latest）"
            echo ""
            echo "- \`${{ steps.meta.outputs.backend }}\`"
            echo "- \`${{ steps.meta.outputs.web }}\`"
            echo ""
            echo "tag = git 短 SHA \`${{ steps.meta.outputs.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
