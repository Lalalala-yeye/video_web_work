server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 500m;

    # 音视频走业务容器，避免经 Java 网关整文件缓冲导致播放卡死。
    location /api/uploads/videos/ {
        proxy_pass http://video:8083/uploads/videos/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location /api/uploads/covers/ {
        proxy_pass http://video:8083/uploads/covers/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location /api/uploads/avatars/ {
        proxy_pass http://user:8082/uploads/avatars/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://gateway:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 变量推迟 DNS：kind/K8s 没有宿主机 SRS 时 Nginx 仍能启动，直播请求再 502。
    resolver 127.0.0.11 10.96.0.10 8.8.8.8 ipv6=off valid=10s;

    location /live-media/ {
        set $srs_host host.docker.internal;
        rewrite ^/live-media/(.*)$ /live/$1 break;
        proxy_pass http://$srs_host:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /srs-api/ {
        set $srs_host host.docker.internal;
        rewrite ^/srs-api/(.*)$ /$1 break;
        proxy_pass http://$srs_host:1985;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
