server:
  port: 8080

spring:
  profiles:
    active: local    # 启动时加载 local 配置
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

upload:
  path: uploads

# 直播 SRS 地址（本地 Docker：HLS 映射到 8088，避免与后端 8080 冲突）
live:
  play-url-prefix: http://127.0.0.1:8088/live/
  push-url-prefix: rtmp://127.0.0.1:1935/live/

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: "change-me-in-local-config-at-least-32-chars!!"
  expire: 86400000