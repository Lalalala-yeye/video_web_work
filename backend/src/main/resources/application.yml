server:
  port: 8081

spring:
  profiles:
    active: local    # 启动时加载 local 配置
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

upload:
  path: uploads

# 直播媒体路径前缀（相对路径；播放/推流主机名由前端按用户访问域名拼接）
live:
  media-path-prefix: /live/

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: "change-me-in-local-config-at-least-32-chars!!"
  expire: 86400000