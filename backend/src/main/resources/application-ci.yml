# CI / 容器用。账号密码不要写死在业务代码里，用环境变量覆盖默认值。
# GitHub Actions、Dockerfile、docker compose、K8s 一律注入下面这套名字（不要再用 SPRING_DATASOURCE_*）。
#
#   SPRING_PROFILES_ACTIVE   固定 ci
#   MYSQL_HOST               CI=127.0.0.1；compose 服务名 mysql；单独 docker run 连宿主机=host.docker.internal
#   MYSQL_PORT               3306
#   MYSQL_DATABASE           doinb
#   MYSQL_USER               root（或专用账号）
#   MYSQL_PASSWORD           必须注入；镜像占位 must-set-at-run
#   JWT_SECRET               至少 32 字符；必须注入
#   UPLOAD_PATH              容器内建议 /app/uploads
#
# MySQL 官方镜像自己还要 MYSQL_ROOT_PASSWORD / MYSQL_DATABASE（那是数据库容器的，不是 Spring 读的）。
# 后端 MYSQL_USER=root 时，MYSQL_PASSWORD 必须等于该镜像的 MYSQL_ROOT_PASSWORD。
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:doinb}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:test}
    driver-class-name: com.mysql.cj.jdbc.Driver

jwt:
  secret: ${JWT_SECRET:ci-test-secret-at-least-32-characters!!}

upload:
  path: ${UPLOAD_PATH:/tmp/doinb-uploads}
