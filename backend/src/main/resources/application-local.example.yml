spring:
  datasource:
    url: jdbc:mysql://localhost:3306/doinb?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    # 密码含 @、: 等特殊字符时请用双引号包裹，例如 password: "@yourPassword"
    password: "改成你的MySQL密码"

jwt:
  secret: "改成至少32个字符的随机字符串用于JWT签名"

# 直播无需在此配置 IP；观众/主播用同一网站地址访问即可。
# 局域网开播请用电脑 IP 打开网站（如 http://10.x.x.x:8787），并执行 deploy\srs-docker.ps1。
#
# 也可用环境变量代替本文件（容器 / CI / 镜像同一套名字）：
#   SPRING_PROFILES_ACTIVE=ci
#   MYSQL_HOST MYSQL_PORT MYSQL_DATABASE MYSQL_USER MYSQL_PASSWORD
#   JWT_SECRET UPLOAD_PATH
