# SRS 本地 Docker 配置（基于官方 docker.conf，优化浏览器屏幕分享 → FLV/HLS）
listen              1935;
max_connections     1000;
srs_log_tank        console;
daemon              off;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

rtc_server {
    enabled on;
    listen 8000;
    candidate $CANDIDATE;
}

vhost __defaultVhost__ {
    hls {
        enabled         on;
    }
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    rtc {
        enabled         on;
        rtmp_to_rtc     on;
        rtc_to_rtmp     on;
        # 屏幕分享 getDisplayMedia 时降低 PLI 频率，减轻 empty nalu / 卡顿（SRS issue #2677）
        pli_for_rtmp    0.5;
    }
}
