apiVersion: v1
kind: ConfigMap
metadata:
  name: doinb-runtime
data:
  SPRING_PROFILES_ACTIVE: "ci"
  MYSQL_HOST: "mysql"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "doinb"
  MYSQL_USER: "root"
  DOINB_USER_URL: "http://user:8082"
  DOINB_VIDEO_URL: "http://video:8083"
  DOINB_LIVE_URL: "http://live:8084"
  DOINB_INTERACT_URL: "http://interact:8085"
  DOINB_MESSAGE_URL: "http://message:8086"
  UPLOAD_PATH: "/app/uploads"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
  APP_VERSION: "cde7310"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  labels:
    app: user
spec:
  replicas: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: user
  template:
    metadata:
      labels:
        app: user
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36.1
          command: ["sh", "-c", "until nc -z mysql 3306; do echo waiting; sleep 2; done"]
      containers:
        - name: user
          image: ghcr.io/lalalala-yeye/doinb-user:cde7310
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: doinb-runtime
            - secretRef:
                name: doinb-secrets
          env:
            - name: SERVER_PORT
              value: "8082"
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { cpu: 2000m, memory: 512Mi }
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: user
spec:
  selector:
    app: user
  ports:
    - name: http
      port: 8082
      targetPort: http
---
