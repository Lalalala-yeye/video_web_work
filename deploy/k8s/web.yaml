apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: doinb
  labels:
    app: web
spec:
  replicas: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      hostAliases:
        - ip: "127.0.0.1"
          hostnames:
            - host.docker.internal
      containers:
        - name: web
          image: ghcr.io/lalalala-yeye/doinb-web:cde7310
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: doinb
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Docker Desktop：浏览器直接开 localhost:8787，不必再 port-forward。
apiVersion: v1
kind: Service
metadata:
  name: web-local
  namespace: doinb
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - name: http
      port: 8787
      targetPort: http
